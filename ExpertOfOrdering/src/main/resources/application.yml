spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:localdb;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
