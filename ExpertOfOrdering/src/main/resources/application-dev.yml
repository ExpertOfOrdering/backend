spring:
  config:
    activate:
      on-profile: dev

  # H2 데이터베이스 설정 (주석 처리)
  # datasource:
  #   url: jdbc:h2:mem:testdb
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:

  # MySQL 데이터베이스 설정
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expertofordering}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  h2:
    console:
      enabled: false # H2 콘솔 비활성화

server:
  port: 8081

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger

jwt:
  secret: "32바이트이상_긴_시크릿_문자열_반드시_설정"
  access-token-validity-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: mappings

openai:
  api-key: ${OPENAI_API_KEY:YOUR_API_KEY_HERE}
