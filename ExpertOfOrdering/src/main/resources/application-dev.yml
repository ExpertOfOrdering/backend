spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:devdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081
  address: 0.0.0.0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger

jwt:
  # dev에서는 하드코딩하지 말고 환경변수 우선 + 기본값
  secret: ${JWT_SECRET:test-secret-test-secret-test-secret-1234}
  access-token-validity-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: mappings

openai:
  api-key: ${OPENAI_API_KEY:YOUR_API_KEY_HERE}
