spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/expertofordering}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:plink2025}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false # MySQL을 사용하므로 H2 콘솔은 비활성화합니다.

server:
  port: 8081
  address: 0.0.0.0

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger

jwt:
  secret: ${JWT_SECRET:test-secret-test-secret-test-secret-1234}
  accessTokenValidityMs: 3600000

management:
  endpoints:
    web:
      exposure:
        include: mappings

openai:
  api-key: ${OPENAI_API_KEY:YOUR_API_KEY_HERE}
