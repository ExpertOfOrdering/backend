name: Deploy Backend

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x ExpertOfOrdering/gradlew

      - name: Build
        working-directory: ExpertOfOrdering
        run: ./gradlew clean build

      - name: Determine profile
        id: profile
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "profile=prod" >> $GITHUB_OUTPUT
          else
            echo "profile=dev" >> $GITHUB_OUTPUT
          fi

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "ExpertOfOrdering/build/libs/backend-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop expert-backend-${{ steps.profile.outputs.profile }} || true
            mv /home/ubuntu/backend-0.0.1-SNAPSHOT.jar /home/ubuntu/app.jar
            sudo systemctl start expert-backend-${{ steps.profile.outputs.profile }}
