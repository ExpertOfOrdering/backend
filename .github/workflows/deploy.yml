name: Deploy Backend

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # gradlew 실행 권한
      - name: Grant execute permission
        run: chmod +x ExpertOfOrdering/gradlew

      # 올바른 디렉터리에서 빌드
      - name: Build
        working-directory: ExpertOfOrdering
        run: ./gradlew clean build

      # 브랜치에 따라 profile 결정
      - name: Determine profile
        id: profile
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "profile=prod" >> $GITHUB_OUTPUT
          else
            echo "profile=dev" >> $GITHUB_OUTPUT
          fi

      # JAR 복사
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "ExpertOfOrdering/build/libs/*-SNAPSHOT.jar"
          target: "/home/ubuntu/"

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: false
          script: |
            pkill -f app.jar || true
            mv /home/ubuntu/*-SNAPSHOT.jar /home/ubuntu/app.jar
            nohup java -jar /home/ubuntu/app.jar \
              --spring.profiles.active=${{ steps.profile.outputs.profile }} \
              > /home/ubuntu/app.log 2>&1 &
